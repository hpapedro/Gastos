<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Glowing background circle -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.12" filter="url(#glow)"/>

  <!-- Icon Graphics: Financial Graph & Diamond Emblem -->
  <path d="M160 336 L216 270 L280 310 L352 196" fill="none" stroke="url(#emeraldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="352" cy="196" r="18" fill="#34D399" filter="url(#glow)"/>
  
  <!-- Subtle card lines -->
  <rect x="136" y="146" width="240" height="220" rx="32" fill="none" stroke="#334155" stroke-width="6" opacity="0.4"/>
</svg>
